<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexMail • Admin Portal</title>
    <style>
        /* Base square and dark styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important; /* Strictly no rounded corners */
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main login container */
        .login-card {
            background-color: #141414;
            border: 2px solid #262626;
            width: 100%;
            max-width: 420px;
            padding: 35px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-align: center;
        }

        .brand span {
            background-color: #ffffff;
            color: #0d0d0d;
            padding: 2px 6px;
            margin-right: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #aaaaaa;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            background-color: #0d0d0d;
            border: 2px solid #262626;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #ffffff;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        /* Sharp button without complex effects */
        .btn-send {
            width: 100%;
            background-color: #ffffff;
            color: #0d0d0d;
            border: 2px solid #ffffff;
            padding: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-send:hover {
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* Status feedback messages */
        .status-message {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            padding: 10px;
            text-align: center;
        }

        /* Hidden portal content */
        #mainPortal {
            display: none;
        }

        #authScreen {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="authScreen">
        <div class="login-card">
            <div class="brand"><span>Nex</span>Mail Portal</div>
            
            <div class="form-group">
                <label>Admin Access Code</label>
                <input type="password" id="accessCode" placeholder="Enter access code...">
            </div>

            <button class="btn-send" onclick="verifyAccess()">Authenticate</button>

            <div id="authStatus" class="status-message"></div>
        </div>
    </div>

    <!-- Main Portal (Hidden until authenticated) -->
    <div id="mainPortal">
        <div class="login-card">
            <div class="brand"><span>Nex</span>Mail Portal</div>
            
            <!-- Field for your Resend API Key -->
            <div class="form-group">
                <label>Resend API Key</label>
                <input type="password" id="apiKey" placeholder="re_123456789...">
            </div>

            <!-- Sender Address (Your verified Resend domain) -->
            <div class="form-group">
                <label>From Address</label>
                <input type="email" id="fromEmail" value="ceomain@mail.nxgcorp.dpdns.org">
            </div>

            <!-- Recipient Address -->
            <div class="form-group">
                <label>To Address</label>
                <input type="email" id="toEmail" placeholder="recipient@example.com">
            </div>

            <!-- Message Details -->
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" value="NexMail System Alert">
            </div>

            <div class="form-group">
                <label>Message Body (HTML Supported)</label>
                <textarea id="message" placeholder="Type your email content here..."></textarea>
            </div>

            <!-- Execution action acting as your login mechanism -->
            <button class="btn-send" onclick="sendMailViaAPI()">Execute Send</button>

            <button class="btn-send" onclick="logout()" style="background-color: #262626; color: #aaaaaa; border-color: #262626; margin-top: 5px;">Logout</button>

            <div id="status" class="status-message"></div>
        </div>
    </div>

    <script>
        // Obfuscated password verification (hidden in plain sight)
        function verifyAccess() {
            const inputCode = document.getElementById('accessCode').value;
            const authStatus = document.getElementById('authStatus');
            
            // Password is hashed with a simple transformation
            const correctHash = atob('UGVybzczczczIQ=='); // Base64 encoded: "Pero7373!"
            
            if (inputCode === correctHash) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainPortal').style.display = 'flex';
                document.getElementById('accessCode').value = '';
            } else {
                authStatus.style.display = 'block';
                authStatus.style.backgroundColor = '#3a1414';
                authStatus.style.color = '#ff6666';
                authStatus.style.border = '1px solid #ff6666';
                authStatus.innerText = 'Error: Invalid access code.';
                document.getElementById('accessCode').value = '';
            }
        }

        function logout() {
            document.getElementById('mainPortal').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('apiKey').value = '';
            document.getElementById('toEmail').value = '';
            document.getElementById('message').value = '';
            document.getElementById('status').style.display = 'none';
        }

        // Allow Enter key to submit password
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('accessCode').addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    verifyAccess();
                }
            });
        });

        async function sendMailViaAPI() {
            const apiKey = document.getElementById('apiKey').value;
            const fromEmail = document.getElementById('fromEmail').value;
            const toEmail = document.getElementById('toEmail').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            const statusDiv = document.getElementById('status');

            // Basic validation check
            if (!apiKey || !toEmail || !message) {
                statusDiv.style.display = 'block';
                statusDiv.style.backgroundColor = '#3a1414';
                statusDiv.style.color = '#ff6666';
                statusDiv.style.border = '1px solid #ff6666';
                statusDiv.innerText = 'Error: Fill in all fields.';
                return;
            }

            statusDiv.style.display = 'block';
            statusDiv.style.backgroundColor = '#1a1a1a';
            statusDiv.style.color = '#aaaaaa';
            statusDiv.style.border = '1px solid #333333';
            statusDiv.innerText = 'Sending request...';

            try {
                // Direct HTTP POST request to the Resend API servers
                const response = await fetch('https://resend.com', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        from: fromEmail,
                        to: toEmail,
                        subject: subject,
                        html: message
                    })
                });

                if (response.ok) {
                    statusDiv.style.backgroundColor = '#143a1e';
                    statusDiv.style.color = '#00ff66';
                    statusDiv.style.border = '1px solid #00ff66';
                    statusDiv.innerText = 'Success: Email dispatched.';
                } else {
                    const errData = await response.json();
                    statusDiv.style.backgroundColor = '#3a1414';
                    statusDiv.style.color = '#ff6666';
                    statusDiv.style.border = '1px solid #ff6666';
                    statusDiv.innerText = `Failed: ${errData.message || response.statusText}`;
                }
            } catch (error) {
                statusDiv.style.backgroundColor = '#3a1414';
                statusDiv.style.color = '#ff6666';
                statusDiv.style.border = '1px solid #ff6666';
                statusDiv.innerText = `Network Error: ${error.message}`;
            }
        }
    </script>

</body>
</html>
